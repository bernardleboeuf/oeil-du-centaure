name: Veille juridique — collecte quotidienne

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer la collecte
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/collecte.mjs

      - name: Publier veille.json si modifié
        run: |
          git config user.name "Oeil du Centaure (bot)"
          git config user.email "actions@users.noreply.github.com"
          git add veille.json
          git diff --staged --quiet || git commit -m "Mise à jour de la veille"
          git push
