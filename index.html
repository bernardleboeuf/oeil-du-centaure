<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Œil du Centaure — Hebdomadaire d'actualité numérique · Centaure Avocats</title>
<meta name="description" content="L'hebdomadaire d'actualité juridique numérique de Centaure Avocats. Jurisprudence, réglementation et veille européenne, actualisées chaque jour à partir de sources officielles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#D81F2A; --ink:#0F1115; --ink2:#3C4048; --mute:#8A8F98;
    --bg:#FFFFFF; --soft:#F5F6F8; --line:#E8EAED; --card:#FFFFFF;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Spline Sans',system-ui,sans-serif;color:var(--ink);background:var(--soft);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;background:var(--bg);min-height:100vh}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}

  /* ===== HEADER ===== */
  .top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,4vw,40px);gap:16px}
  .brand{display:flex;align-items:center;gap:11px;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-.02em}
  .brand .eye{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex-shrink:0;position:relative}
  .brand .eye::after{content:"";width:11px;height:11px;border-radius:50%;background:#fff}
  .brand .eye::before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--red);z-index:2}
  .brand b{color:var(--ink);font-weight:600} .brand span{color:var(--red);font-weight:600}
  .top-meta{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--mute)}
  .top-profil{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-weight:600;color:var(--ink);font-size:13px;cursor:pointer}
  .top-profil .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}

  /* ===== HERO / COVER ===== */
  .hero{padding:clamp(48px,8vw,96px) clamp(20px,4vw,40px) clamp(32px,5vw,56px);max-width:880px}
  .hero-kicker{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--red);margin-bottom:22px}
  .hero-kicker .pulse{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(216,31,42,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,31,42,.45)}70%{box-shadow:0 0 0 10px rgba(216,31,42,0)}100%{box-shadow:0 0 0 0 rgba(216,31,42,0)}}
  .hero h1{font-size:clamp(34px,6vw,60px);font-weight:700;line-height:1.04;letter-spacing:-.035em;margin-bottom:22px}
  .hero h1 em{font-style:normal;color:var(--red)}
  .hero p{font-size:clamp(16px,2.2vw,20px);color:var(--ink2);line-height:1.6;max-width:620px;margin-bottom:40px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}

  .step-label{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .step-label .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
  .chip{padding:12px 20px;border:1.5px solid var(--line);border-radius:100px;background:var(--card);cursor:pointer;font-size:15px;font-weight:600;color:var(--ink2);transition:all .18s cubic-bezier(.2,.8,.3,1);font-family:inherit}
  .chip:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}
  .chip.on{border-color:var(--red);background:var(--red);color:#fff}
  .theme-chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:36px}
  .tchip{padding:9px 16px;border:1.5px solid var(--line);border-radius:100px;background:var(--card);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--mute);transition:all .16s;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
  .tchip:hover{border-color:#C9CDD3}
  .tchip.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .tchip .tk{width:8px;height:8px;border-radius:3px}
  .cta-big{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;border:none;border-radius:100px;padding:16px 32px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 8px 24px -10px rgba(216,31,42,.5)}
  .cta-big:hover{transform:translateY(-2px);box-shadow:0 14px 32px -10px rgba(216,31,42,.6)}
  .cta-big:disabled{opacity:.4;cursor:default;box-shadow:none}
  .cta-big .arr{transition:transform .2s}
  .cta-big:hover:not(:disabled) .arr{transform:translateX(4px)}
  /* ===== ÉDITION ===== */
  .ed-head{padding:clamp(28px,4vw,44px) clamp(20px,4vw,40px) 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .ed-title{font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1}
  .ed-sub{font-size:13.5px;color:var(--mute);margin-top:8px;display:flex;align-items:center;gap:8px}
  .ed-sub .live{width:7px;height:7px;border-radius:50%;background:#16A34A;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
  .ed-edit{font-size:13.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:100px;padding:8px 16px;background:var(--card);cursor:pointer;font-family:inherit}
  .ed-edit:hover{border-color:var(--ink)}

  /* HERO ARTICLE (la une) */
  .feature{padding:8px clamp(20px,4vw,40px) clamp(24px,4vw,40px);display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(20px,3vw,40px);align-items:start}
  @media(max-width:860px){.feature{grid-template-columns:1fr}}
  .feat-main{}
  .feat-img{width:100%;aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;position:relative;margin-bottom:20px}
  .feat-img .ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:18px}
  .feat-img .ph-label{color:rgba(255,255,255,.95);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
  .tag .tk{width:9px;height:9px;border-radius:3px}
  .feat-title{font-size:clamp(26px,3.6vw,40px);font-weight:700;line-height:1.12;letter-spacing:-.03em;margin-bottom:16px}
  .feat-chapo{font-size:clamp(16px,2vw,18px);color:var(--ink2);line-height:1.6;margin-bottom:18px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .feat-meta{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute);flex-wrap:wrap}
  .feat-src{color:var(--ink);font-weight:600}
  .meta-read{color:var(--red);font-weight:600;border-bottom:1.5px solid transparent;transition:border .15s}
  .meta-read:hover{border-color:var(--red)}
  .feat-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:all .16s}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{background:#000;transform:translateY(-1px)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--ink)}

  /* COLONNE "EN BREF" */
  .aside-bref{}
  .bref-h{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:9px}
  .bref-h .live{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 2s infinite}
  .bref-item{display:block;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;transition:all .15s}
  .bref-item:hover{padding-left:6px}
  .bref-item:hover .bi-title{color:var(--red)}
  .bi-tag{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
  .bi-tag .tk{width:7px;height:7px;border-radius:2px}
  .bi-title{font-size:15.5px;font-weight:600;line-height:1.3;color:var(--ink);transition:color .15s;margin-bottom:6px}
  .bi-meta{font-size:12px;color:var(--mute)}

  /* GRILLE DE RUBRIQUES (cartes) */
  .sections{padding:clamp(20px,3vw,32px) clamp(20px,4vw,40px) clamp(40px,5vw,60px)}
  .sec{margin-bottom:clamp(36px,5vw,52px)}
  .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .sec-bar{width:4px;height:26px;border-radius:3px}
  .sec-name{font-size:clamp(19px,2.4vw,24px);font-weight:700;letter-spacing:-.02em}
  .sec-ref{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:500}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;min-height:170px}
  .card:hover{border-color:#D5D8DD;box-shadow:0 12px 30px -16px rgba(15,17,21,.18);transform:translateY(-3px)}
  .card-tag{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
  .card-flash{font-size:10px;font-weight:800;color:#fff;background:var(--red);padding:2px 7px;border-radius:5px;letter-spacing:.04em}
  .card-title{font-size:17.5px;font-weight:700;line-height:1.3;letter-spacing:-.02em;margin-bottom:auto;color:var(--ink)}
  .card:hover .card-title{color:var(--red)}
  .card-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .card-src{color:var(--ink2);font-weight:600}
  .card-read{margin-left:auto;color:var(--red);font-weight:600}
  .forma-card{grid-column:1/-1;display:flex;align-items:center;gap:16px;background:linear-gradient(100deg,rgba(216,31,42,.05),rgba(216,31,42,.02));border:1px solid rgba(216,31,42,.18);border-radius:var(--r);padding:18px 22px;margin-top:4px}
  .forma-badge{font-size:10px;font-weight:800;color:#fff;background:var(--red);padding:5px 10px;border-radius:7px;white-space:nowrap;letter-spacing:.04em}
  .forma-txt{flex:1}.forma-t{font-weight:700;font-size:15px;margin-bottom:3px}.forma-d{font-size:12.5px;color:var(--mute)}
  .forma-arr{color:var(--red);font-weight:700;font-size:18px}
  /* AVATARS */
  .avts{display:inline-flex;align-items:center}
  .avt{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15);margin-left:-7px;background:#ddd}
  .avt:first-child{margin-left:0}
  .avt-i{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;background:var(--ink)}

  /* GALAXIE + FOOTER */
  .galaxy{padding:clamp(36px,5vw,56px) clamp(20px,4vw,40px);background:var(--ink);color:#fff}
  .galaxy-h{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:24px}
  .galaxy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .gcard{display:flex;flex-direction:column;gap:6px;padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:var(--r);background:rgba(255,255,255,.03);transition:all .2s}
  .gcard:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
  .gname{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .gdesc{font-size:13px;color:rgba(255,255,255,.55)}
  .garr{margin-top:6px;color:var(--red);font-weight:700}
  .foot{padding:28px clamp(20px,4vw,40px);background:var(--ink);color:rgba(255,255,255,.5);font-size:12px;line-height:1.6;border-top:1px solid rgba(255,255,255,.1)}
  .foot-name{color:#fff;font-weight:700;font-size:14px}
  .foot-deon{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;line-height:1.6;color:rgba(255,255,255,.4);max-width:920px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}

  /* PANNEAU */
  .overlay{position:fixed;inset:0;background:rgba(15,17,21,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
  @media(min-width:600px){.overlay{align-items:center;padding:20px}}
  .sheet{background:var(--bg);border-radius:24px 24px 0 0;padding:30px 26px 34px;max-width:460px;width:100%;box-shadow:0 -10px 60px rgba(0,0,0,.3);animation:slideup .34s cubic-bezier(.2,.9,.3,1) both}
  @media(min-width:600px){.sheet{border-radius:24px;animation:popin .3s cubic-bezier(.2,.9,.3,1) both}}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  @keyframes popin{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
  .sheet-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:var(--soft);border:none;font-size:15px;color:var(--mute);cursor:pointer;display:grid;place-items:center}
  .sheet-tag{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
  .sheet-tag .tk{width:8px;height:8px;border-radius:3px}
  .sheet-title{font-size:20px;font-weight:700;line-height:1.28;letter-spacing:-.02em;margin-bottom:16px}
  .sheet-avts{display:flex;margin-bottom:14px}.sheet-avts .avt{width:42px;height:42px}
  .sheet-txt{font-size:14.5px;color:var(--ink2);line-height:1.6;margin-bottom:22px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .sheet-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;border:none;margin-bottom:10px;transition:all .16s}
  .sb-red{background:var(--red);color:#fff}.sb-red:hover{background:#B81822}
  .sb-dark{background:var(--ink);color:#fff}.sb-dark:hover{background:#000}
  .sb-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.sb-ghost:hover{border-color:var(--ink)}

  .rev{animation:rev .5s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rev{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  .masthead{text-align:center;padding:clamp(40px,6vw,72px) 20px clamp(16px,3vw,28px);border-bottom:1px solid var(--line)}
  
  
  
  .mh-title{font-family:'Newsreader',Georgia,serif;font-size:clamp(40px,8vw,76px);font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink)}
  .mh-title span{color:var(--red)}
  .mh-sub{font-size:clamp(13px,1.8vw,15px);color:var(--mute);margin-top:14px;font-weight:500;letter-spacing:.01em}

  /* MOSAÏQUE : grande carte + grille */
  .mosaic{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
  @media(max-width:780px){.mosaic{grid-template-columns:1fr}}
  .card-big{min-height:220px;border-left:4px solid var(--tc)}
  .card-title.big{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.025em;margin-bottom:12px}
  .card-chapo{font-size:14.5px;color:var(--ink2);line-height:1.6;margin-bottom:14px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .mosaic-rest{display:flex;flex-direction:column;gap:12px}
  .mosaic-rest .card{min-height:0;padding:16px 18px}
  .mosaic-rest .card-title{font-size:15.5px}

  /* LISTE ÉDITORIALE : fil numéroté */
  .edlist{display:flex;flex-direction:column}
  .edrow{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:all .15s}
  .edrow:hover{padding-left:8px;background:linear-gradient(90deg,rgba(216,31,42,.03),transparent)}
  .edrow:first-child{border-top:1px solid var(--line)}
  .edrow-n{font-family:'Newsreader',Georgia,serif;font-size:24px;font-weight:600;color:var(--red);min-width:36px;line-height:1}
  .edrow-title{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin-bottom:6px;color:var(--ink)}
  .edrow:hover .edrow-title{color:var(--red)}
  .edrow-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}

  /* ENCARTS PUB CENTAURE */
  .promo{display:block;margin:8px 0 4px;padding:26px 28px;border-radius:var(--r);background:linear-gradient(120deg,var(--pc),color-mix(in srgb,var(--pc) 75%,#000));color:#fff;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s}
  .promo:hover{transform:translateY(-2px)}
  .promo::after{content:"";position:absolute;top:-40%;right:-10%;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
  .promo-tag{font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.8;margin-bottom:10px}
  .promo-t{font-family:'Newsreader',Georgia,serif;font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
  .promo-d{font-size:15px;opacity:.92;margin-bottom:16px;max-width:70%}
  .promo-cta{font-size:14px;font-weight:600;display:inline-block;border-bottom:1.5px solid rgba(255,255,255,.5);padding-bottom:2px}

  /* JUSTIFICATION incontournable des paragraphes */
  .feat-chapo,.hero p,.sheet-txt,.foot-deon,.card-chapo,.promo-d{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .promo-d{text-align:left}

  
  

  .mh-i{position:relative;display:inline-block}
  .mh-eye-dot{position:absolute;left:50%;transform:translateX(-50%);top:-.34em;width:.46em;height:.46em}
  .mh-red{color:var(--red)}
</style>
</head>
<body><div class="wrap"><div id="app"></div></div>
<script>
const VEILLE_ENDPOINT = "veille.json";  // fichier voisin, régénéré chaque matin par la minuterie
// Tant que non branchée, on utilise le jeu de démonstration ci-dessous.

const PROFILS = [
  { id:"commune", label:"Collectivités territoriales", comps:["cac","imm","rhs","lib","env"] },
  { id:"sante", label:"Hôpital / GHT / ESSMS", comps:["sante","rhs","enf","cac"] },
  { id:"departement", label:"Département / Action sociale", comps:["enf","sante","lib","rhs"] },
  { id:"bailleur", label:"Bailleur social", comps:["imm","cac","env","pia"] },
  { id:"etat", label:"Opérateur de l'État", comps:["cac","lib","rhs","env","om"] },
  { id:"entreprise", label:"Entreprise / Dirigeant", comps:["pia","cac","rhs","lib"] },
];

async function loadFeed(){
  try{
    const r=await fetch(VEILLE_ENDPOINT,{signal:AbortSignal.timeout(9000),headers:{"Accept":"application/json; charset=utf-8"}});
    if(!r.ok) throw 0;
    const buf=await r.arrayBuffer();
    const data=JSON.parse(new TextDecoder("utf-8").decode(buf));
    if(data.items&&data.items.length){
      state.feed=data.items.map(it=>({comp:it.comp,source:it.source,date:it.date&&it.date.includes("T")?fmtDate(it.date):(it.date||""),type:it.type||(it.srcType==="LEG"?"Réglementation":"Jurisprudence"),titre:it.titre,chapo:it.chapo||it.resume||"",impact:it.impact||1,forma:it.impact===3,lien:it.lien||"#"}));
      state.live=true; state.generatedAt=data.generatedAt;
    }
  }catch(e){}
}

function renderSection(s,si,m){
  const c=COMP[s.id]; const items=s.items;
  const head=`<div class="sec-head"><span class="sec-bar" style="background:${tint(s.id)}"></span><span class="sec-name">${esc(c.rub)}</span><span class="sec-ref">${avatars(c.ref)}${esc(c.ref)}</span></div>`;
  let body="";
  // ALTERNANCE : sections paires = mosaïque (1 grande + petites), impaires = liste éditoriale
  if(si%2===0){
    // MOSAÏQUE : première carte en grand, le reste en grille
    const lead=items[0], rest=items.slice(1);
    body=`<div class="mosaic">
      ${lead?`<div class="card card-big" onclick="sheet('${lead.comp}',${idx(lead)})" style="--tc:${tint(lead.comp)}">
        <div class="card-tag" style="color:${tint(lead.comp)}">${lead.impact===3?'<span class="card-flash">À LA UNE</span>':esc(lead.type)}</div>
        <div class="card-title big">${esc(lead.titre)}</div>
        ${lead.chapo?`<div class="card-chapo">${esc(lead.chapo)}</div>`:""}
        <div class="card-meta"><span class="card-src">${esc(lead.source)}</span><span>·</span>${esc(lead.date)}<a class="card-read" href="${readUrl(lead)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">Lire ↗</a></div>
      </div>`:""}
      <div class="mosaic-rest">
        ${rest.map(it=>`<div class="card" onclick="sheet('${it.comp}',${idx(it)})">
          <div class="card-tag" style="color:${tint(it.comp)}"><span class="tk" style="background:${tint(it.comp)}"></span>${esc(it.type)}</div>
          <div class="card-title">${esc(it.titre)}</div>
          <div class="card-meta"><span class="card-src">${esc(it.source)}</span><span>·</span>${esc(it.date)}</div>
        </div>`).join("")}
      </div>
    </div>`;
  } else {
    // LISTE ÉDITORIALE : lignes numérotées, plus dense, façon "fil"
    body=`<div class="edlist">
      ${items.map((it,i)=>`<div class="edrow" onclick="sheet('${it.comp}',${idx(it)})">
        <span class="edrow-n">${String(i+1).padStart(2,"0")}</span>
        <div class="edrow-body">
          <div class="edrow-title">${esc(it.titre)}</div>
          <div class="edrow-meta"><span class="card-src">${esc(it.source)}</span><span>·</span>${esc(it.date)}<span>·</span>${esc(it.type)}<a class="card-read" href="${readUrl(it)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">Lire ↗</a></div>
        </div>
      </div>`).join("")}
    </div>`;
  }
  const formaBlock = m[s.id]&&m[s.id].some(it=>it.forma)?forma(s.id):"";
  // encart Centaure tous les 2 sections (après section impaire)
  const promoBlock = (si%2===1)?promo(Math.floor(si/2)):"";
  return `<section class="sec rev">${head}${body}${formaBlock}</section>${promoBlock}`;
}

  const used=new Set([lead,...brefs]);
  const m={};items.forEach(it=>{if(it!==lead)(m[it.comp]=m[it.comp]||[]).push(it);});
  const sections=state.comps.filter(id=>m[id]&&m[id].length).map(id=>({id,items:m[id]}));
  const maj=state.live&&state.generatedAt?("Mis à jour le "+new Date(state.generatedAt).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})):"Édition de démonstration";

  app.innerHTML=topbar(false)+masthead()+`
    <div class="ed-head">
      <div><div class="ed-title">Votre édition</div><div class="ed-sub"><span class="live"></span>${maj} · ${items.length} actualités fraîches · sources officielles</div></div>
      <button class="ed-edit" onclick="reset()">Modifier mes thèmes</button>
    </div>
    ${lead?`<div class="feature rev">
      <div class="feat-main">
        <div class="feat-img"><div class="ph" style="${phBg(lead.comp)}"><span class="ph-label">${esc(COMP[lead.comp].rub)}</span></div></div>
        <div class="tag"><span class="tk" style="background:${tint(lead.comp)}"></span>${esc(COMP[lead.comp].rub)}</div>
        <h2 class="feat-title">${esc(lead.titre)}</h2>
        ${lead.chapo?`<p class="feat-chapo">${esc(lead.chapo)}</p>`:""}
        <div class="feat-meta"><span class="feat-src">${esc(lead.source)}</span><span>·</span>${esc(lead.date)}<span>·</span><span>${esc(lead.type)}</span><a class="meta-read" href="${readUrl(lead)}" target="_blank" rel="noreferrer">Lire la source ↗</a></div>
        <div class="feat-actions">
          <button class="btn btn-dark" onclick="sheet('${lead.comp}',${idx(lead)})">Demander un éclairage</button>
          <a class="btn btn-ghost" href="${readUrl(lead)}" target="_blank" rel="noreferrer">Accéder à la source ↗</a>
        </div>
      </div>
      <aside class="aside-bref">
        <div class="bref-h"><span class="live"></span>En bref</div>
        ${brefs.map(b=>`<button class="bref-item" onclick="sheet('${b.comp}',${idx(b)})"><div class="bi-tag"><span class="tk" style="background:${tint(b.comp)}"></span>${esc(COMP[b.comp].rub)}</div><div class="bi-title">${esc(b.titre)}</div><div class="bi-meta">${esc(b.source)} · ${esc(b.date)}</div></button>`).join("")}
      </aside>
    </div>`:""}
    <div class="sections">
      ${sections.map((s,si)=>renderSection(s,si,m)).join("")}
    </div>`+galaxy();
}
function idx(it){return state.feed.indexOf(it);}

function sheet(comp,i){
  const it=state.feed[i];const c=COMP[comp];
  const ov=document.createElement("div");ov.className="overlay";ov.onclick=()=>ov.remove();
  ov.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <button class="sheet-close" onclick="this.closest('.overlay').remove()">✕</button>
    <div class="sheet-tag"><span class="tk" style="background:${tint(comp)}"></span>${esc(c.rub)}</div>
    <div class="sheet-title">${esc(it.titre)}</div>
    <div class="sheet-avts">${avatars(c.ref)}</div>
    <p class="sheet-txt">${esc(c.ref.split(" · ")[0])} et son équipe peuvent revenir vers vous sur l'impact de cette actualité pour votre activité. Un échange court, sans engagement.</p>
    <a class="sheet-btn sb-red" href="mailto:${c.mail}?subject=${encodeURIComponent("Éclairage — "+it.titre)}">Écrire à ${esc(c.ref.split(" · ")[0])}</a>
    <a class="sheet-btn sb-dark" href="${readUrl(it)}" target="_blank" rel="noreferrer">Accéder à la source officielle ↗</a>
    <a class="sheet-btn sb-ghost" href="${FORMA_URL}/formations/${c.forma.slug}" target="_blank" rel="noreferrer">Se former · ${esc(c.forma.t)}</a>
  </div>`;
  document.body.appendChild(ov);
}

// démarrage increvable : on affiche TOUJOURS la page, même si le flux échoue
loadFeed().catch(function(e){console.warn('feed err',e);}).finally(function(){
  try{ renderCover(); }catch(err){ 
    document.getElementById('app').innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif"><h1 style="color:#D81F2A">L\'Œil du Centaure</h1><p>Chargement…</p></div>';
    console.error('render err',err);
  }
});
</script>
