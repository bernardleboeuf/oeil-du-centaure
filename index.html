 {comp:"dpa",source:"CJUE",date:"4 juin",type:"Jurisprudence",titre:"Concessions : la Cour de justice encadre la modification en cours d'exécution",chapo:"",impact:3,lien:"#"},
 {comp:"dpa",source:"BOAMP",date:"3 juin",type:"Réglementation",titre:"Les seuils de procédure formalisée relevés au 1er juillet",chapo:"",impact:3,lien:"#"},
 {comp:"dpa",source:"TA de Paris",date:"28 mai",type:"Jurisprudence",titre:"Référé précontractuel : le contrôle des critères de sélection resserré",chapo:"",impact:2,lien:"#"},
 {comp:"urba",source:"BO Transition écologique",date:"2 juin",type:"Réglementation",titre:"Un décret réécrit l'instruction des autorisations d'urbanisme",chapo:"Les délais et pièces exigibles évoluent ; les services instructeurs adaptent leurs procédures.",impact:3,forma:true,lien:"#"},
 {comp:"urba",source:"CAA de Lyon",date:"27 mai",type:"Jurisprudence",titre:"Permis de construire : l'intérêt à agir du voisin de nouveau précisé",chapo:"",impact:2,lien:"#"},

 {comp:"perso",source:"Conseil d'État",date:"4 juin",type:"Jurisprudence",titre:"Discipline : le contrôle de proportionnalité de la sanction se durcit",chapo:"Le juge administratif renforce son examen de l'adéquation entre la faute et la sanction.",impact:3,forma:true,lien:"#"},
 {comp:"perso",source:"Légifrance",date:"30 mai",type:"Réglementation",titre:"Protection sociale complémentaire : le décret FPT est paru",chapo:"",impact:2,lien:"#"},
 {comp:"enfance",source:"Conseil d'État",date:"6 juin",type:"Jurisprudence",titre:"Mineurs non accompagnés : le contradictoire s'impose dans l'évaluation de la minorité",chapo:"Une décision qui encadre la procédure d'évaluation et renforce les garanties offertes au jeune.",impact:3,forma:true,lien:"#"},
 {comp:"enfance",source:"Légifrance",date:"29 mai",type:"Réglementation",titre:"L'aide sociale à l'hébergement revalorisée",chapo:"",impact:2,lien:"#"},

 {comp:"etrangers",source:"Conseil d'État",date:"5 juin",type:"Jurisprudence",titre:"OQTF : l'administration doit motiver le refus de délai de départ volontaire",chapo:"Le Conseil d'État resserre les exigences de motivation, avec des conséquences pour les préfectures.",impact:3,forma:true,lien:"#"},
 {comp:"dpg",source:"Conseil d'État",date:"2 juin",type:"Jurisprudence",titre:"Retrait d'un acte créateur de droits : les délais reprécisés",chapo:"Un rappel utile des conditions dans lesquelles l'administration peut revenir sur ses décisions.",impact:2,lien:"#"},
 {comp:"penal",source:"Cour de cassation",date:"31 mai",type:"Jurisprudence",titre:"Prise illégale d'intérêts : l'élément intentionnel au cœur du débat",chapo:"",impact:2,lien:"#"},
 {comp:"dpriv",source:"Cour de cassation",date:"28 mai",type:"Jurisprudence",titre:"Bail commercial : les contours du refus de déspécialisation",chapo:"",impact:2,lien:"#"},
];

let state={profil:null,comps:null,built:false,feed:DEMO,live:false};
const app=document.getElementById("app");

// --- Photos d'associés ---
const PHOTOS={"Jehan Béjot":"bejot","Nicolas Ferré":"ferre","Guillaume Blanchard":"blanchard","Amine Moghrani":"moghrani","Nathalie Lagrée":"lagree","Ludovic Landivaux":"landivaux","Ali Derrouiche":"a-derrouiche","Ourida Derrouiche":"o-derrouiche","Yves Claisse":"claisse","Olivier Magnaval":"magnaval","Jean-Alexandre Cano":"cano","Romain Dussault":"dussault"};
function avatars(refStr){
  const names=refStr.split("·").map(s=>s.trim());
  return `<span class="avts">`+names.map(n=>{
    const slug=PHOTOS[n];
    return slug ? `<img class="avt" src="images/associes/${slug}.jpg" alt="${esc(n)}" title="${esc(n)}">` 
                : `<span class="avt avt-i" title="${esc(n)}">${esc(n.split(" ").map(w=>w[0]).join("").slice(0,2))}</span>`;
  }).join("")+`</span>`;
}
const esc=(s)=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const weekNo=()=>Math.ceil(((new Date()-new Date(new Date().getFullYear(),0,1))/86400000+1)/7);
const today=()=>{const d=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});return d.charAt(0).toUpperCase()+d.slice(1);};

/* tentative de branchement réel ; sinon démo */
async function loadFeed(){
  try{
    const r=await fetch(VEILLE_ENDPOINT,{signal:AbortSignal.timeout(9000),headers:{"Accept":"application/json; charset=utf-8"}});
    if(!r.ok) throw 0;
    const buf=await r.arrayBuffer();
    const txt=new TextDecoder("utf-8").decode(buf);
    const data=JSON.parse(txt);
    if(data.items&&data.items.length){
      state.feed=data.items.map(it=>({
        comp: it.comp,
        source: it.source,
        date: it.date && it.date.includes("T") ? fmtDate(it.date) : (it.date||""),
        type: it.type || (it.srcType==="LEG"?"Réglementation":"Jurisprudence"),
        titre: it.titre,
        chapo: it.chapo || it.resume || "",
        impact: it.impact || 1,
        forma: it.impact===3,        // encart formation sur les sujets à fort impact
        lien: it.lien || "#"
      }));
      state.live=true;
      if(data.generatedAt){ state.generatedAt = data.generatedAt; }
    }
  }catch(e){/* on garde la démo */}
}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});}

function mast(){
  return `<div class="mast">
    <div class="mast-top"><span>N° ${weekNo()} · ${today()}</span><span>HEBDOMADAIRE D'ACTUALITÉ NUMÉRIQUE</span></div>
    <div class="mast-title"><span class="mast-eye">L'ŒIL</span><span class="mast-mark">◐</span><span class="mast-cent">DU CENTAURE</span></div>
    <div class="mast-sub"><span class="mast-sub-l">PAR CENTAURE AVOCATS · ENTREPRISE D'INTELLIGENCES JURIDIQUES</span>
      ${state.built?`<span class="mast-profil">${esc(state.profil.label)}<button class="change" onclick="reset()">↻ refaire</button></span>`:""}
    </div></div>`;
}
function colo(){return `
  <div class="galaxy">
    <div class="galaxy-title">LA GALAXIE CENTAURE</div>
    <div class="galaxy-grid">
      <a class="galaxy-card" href="https://idyllic-choux-fa2fd0.netlify.app/" target="_blank" rel="noreferrer"><span class="g-name">Centaure Avocats</span><span class="g-desc">Le cabinet · 9 compétences, 12 associés</span></a>
      <a class="galaxy-card" href="${FORMA_URL}/" target="_blank" rel="noreferrer"><span class="g-name">FormaConseils</span><span class="g-desc">La formation juridique en semi-mesure</span></a>
      <a class="galaxy-card" href="https://ornate-pudding-8b6b3b.netlify.app/" target="_blank" rel="noreferrer"><span class="g-name">EasyLitis</span><span class="g-desc">La gestion du contentieux</span></a>
      <a class="galaxy-card" href="https://resonant-sundae-b29e1d.netlify.app/" target="_blank" rel="noreferrer"><span class="g-name">Ateliers Lill'loi</span><span class="g-desc">Le coworking juridique à Lille</span></a>
    </div>
  </div>
  <div class="colo">
    <div class="colo-main"><span class="colo-name">L'ŒIL DU CENTAURE</span> · Hebdomadaire d'actualité numérique · contact@centaure-avocats.com</div>
    <div class="colo-deon">Les sources de cette veille ont été recensées et organisées par Centaure Avocats ; elles sont actualisées automatiquement chaque jour. Les informations présentées émanent exclusivement de sources publiques officielles (juridictions, institutions, autorités) et non de Centaure Avocats. Cet outil de veille est purement informatif : il ne constitue ni une consultation, ni un avis juridique, et ne saurait engager la responsabilité du cabinet. Pour toute analyse de votre situation, seul un échange avec un avocat fait foi.</div>
  </div>`;}

function renderCover(){
  app.innerHTML=mast()+`<div class="cover"><div class="rev">
    <p class="cover-lead">Une hebdomadaire d'actualité numérique juridique composée pour vous seul. Dites-nous qui vous êtes et ce que vous suivez — la rédaction assemble votre édition à partir des sources officielles : l'ensemble des juridictions administratives françaises, l'Union européenne, la Cour de cassation.</p>
    <div class="step"><span class="step-n">I</span><span class="step-t">Votre profil</span></div>
    <div class="pgrid" id="pgrid"></div>
    <div id="step2"></div>
  </div></div>`+colo();
  const pg=document.getElementById("pgrid");
  pg.innerHTML=PROFILS.map(p=>`<button class="pcard ${state.profil&&state.profil.id===p.id?'on':''}" onclick="pick('${p.id}')"><span class="pcard-l">${esc(p.label)}</span><span class="ptick"></span></button>`).join("");
  if(state.profil)renderStep2();
}
function renderStep2(){
  const s2=document.getElementById("step2");
  s2.innerHTML=`<div class="rev"><div class="step"><span class="step-n">II</span><span class="step-t">Votre sommaire</span><span class="step-h">les rubriques à suivre</span></div>
    <div class="tgrid">${ORDER.map(id=>`<button class="tcard ${state.comps.includes(id)?'on':''}" onclick="toggle('${id}')"><span class="tbox">${state.comps.includes(id)?'✓':''}</span><span class="tname">${esc(COMP[id].rub)}</span></button>`).join("")}</div>
    <button class="publish" ${state.comps.length?'':'disabled'} onclick="publish()">Publier mon édition <span class="arr">→</span></button></div>`;
}
function pick(id){state.profil=PROFILS.find(p=>p.id===id);state.comps=[...state.profil.comps];renderCover();}
function toggle(id){const i=state.comps.indexOf(id);if(i>=0)state.comps.splice(i,1);else state.comps.push(id);renderStep2();
  document.querySelectorAll('.publish')[0]&&(document.querySelectorAll('.publish')[0].disabled=!state.comps.length);}
function reset(){state.built=false;renderCover();}
function publish(){if(!state.comps.length)return;state.built=true;renderEdition();}

function img(comp){
  const c=COMP[comp];
  // image Wikimedia (charge en prod ; repli aplat si bloquée)
  const src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Conseil-d-etat-paris.jpg/1280px-Conseil-d-etat-paris.jpg";
  return `<div class="lead-img"><div class="fallback" style="background:linear-gradient(135deg,${c.tint},${shade(c.tint,-20)})">${esc(c.rub)}</div>
    <img src="${src}" alt="" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"><div class="grad"></div></div>`;
}
function shade(h,p){const n=parseInt(h.slice(1),16);let r=Math.max(0,Math.min(255,(n>>16)+p)),g=Math.max(0,Math.min(255,((n>>8)&255)+p)),b=Math.max(0,Math.min(255,(n&255)+p));return"#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");}
const SRC_HOME={"Conseil d'État":"https://www.conseil-etat.fr/decisions-de-justice/dernieres-decisions","Sénat":"https://www.senat.fr/","Assemblée nationale":"https://www.assemblee-nationale.fr/","CNIL":"https://www.cnil.fr/fr/actualites","DAJ Bercy":"https://www.economie.gouv.fr/daj","BO Transition écologique":"https://www.bulletin-officiel.developpement-durable.gouv.fr/","Conseil constitutionnel":"https://www.conseil-constitutionnel.fr/"};
function srcHome(it){ if(SRC_HOME[it.source]) return SRC_HOME[it.source]; if((it.source||'').startsWith('TA de')) return 'https://www.tribunal-administratif.fr/'; if((it.source||'').startsWith('CAA de')) return 'https://www.cour-administrative-appel.fr/'; return 'https://www.centaure-avocats.com/'; }
function readLink(it){ const url=(it.lien && it.lien!=='#' && /^https?:/.test(it.lien)) ? it.lien : srcHome(it); return `<a class="art-read" href="${url}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">Lire la source \u2197</a>`; }
let _formaShown=new Set();
function forma(comp){const f=COMP[comp].forma; if(_formaShown.has(f.t)) return ''; _formaShown.add(f.t);return `<a class="forma" href="${FORMA_URL}/formations/${f.slug}" target="_blank" rel="noreferrer"><span class="forma-badge">FORMACONSEILS</span><span class="forma-txt"><span class="forma-titre">${esc(f.t)}</span><span class="forma-date">Prochaine session · ${esc(f.d)}</span></span><span class="forma-arr">→</span></a>`;}

function renderEdition(){
  _formaShown=new Set();
  const items=state.feed.filter(f=>state.comps.includes(f.comp));
  let lead=null;for(const id of state.comps){lead=items.find(it=>it.comp===id&&it.impact===3);if(lead)break;}
  if(!lead)lead=items[0];
  const brefs=items.filter(it=>it!==lead&&it.impact>=2).slice(0,5);
  const m={};items.forEach(it=>{if(it!==lead)(m[it.comp]=m[it.comp]||[]).push(it);});
  const sections=state.comps.filter(id=>m[id]&&m[id].length).map(id=>({id,items:m[id]}));

  app.innerHTML=mast()+`<div class="paper">
    <div class="status"><span class="live"></span>${state.live?"Mise à jour automatique quotidienne":"Démonstration"} · ${items.length} actualités · sources officielles</div>
    <div class="toprow">
      <div class="lead rev">${lead?`${img(lead.comp)}
        <div class="lead-rub">${esc(COMP[lead.comp].rub)}</div>
        <h1 class="lead-title">${esc(lead.titre)}</h1>
        ${lead.chapo?`<p class="lead-chapo"><span class="drop">${esc(lead.chapo.charAt(0))}</span>${esc(lead.chapo.slice(1))}</p>`:""}
        <div class="lead-meta"><span class="by">${esc(lead.source)}</span><span class="sep">·</span>${esc(lead.date)}<span class="sep">·</span><span class="it">${esc(lead.type)}</span>${readLink(lead)}</div>
        ${lead.forma?forma(lead.comp):""}
        <button class="eclair" onclick="sheet('${lead.comp}',${idx(lead)})"><span class="d"></span>Demander un éclairage à ${esc(COMP[lead.comp].ref.split(" · ")[0])}</button>`:""}
      </div>
      <aside class="bref rev"><div class="bref-head">EN BREF</div>
        ${brefs.map(b=>`<button class="bref-item" onclick="sheet('${b.comp}',${idx(b)})"><span class="bref-rub">${esc(COMP[b.comp].rub)}</span><span class="bref-titre">${esc(b.titre)}</span><span class="bref-meta">${esc(b.source)} · ${esc(b.date)}</span></button>`).join("")}
      </aside>
    </div>
    <div class="big-rule"></div>
    <div class="rubgrid">
      ${sections.map(s=>`<section class="sec rev"><div class="sec-head"><span class="sec-name">${esc(COMP[s.id].rub)}</span><span class="sec-ref">${avatars(COMP[s.id].ref)}${esc(COMP[s.id].ref)}</span></div>
        ${s.items.map((it,i)=>`<div class="art"><button class="art-btn" onclick="sheet('${it.comp}',${idx(it)})">${it.impact===3?'<span class="flash">À LA UNE</span>':''}<h3 class="art-t ${i===0?'lead':''}">${esc(it.titre)}</h3>${i===0&&it.chapo?`<p class="art-c">${esc(it.chapo)}</p>`:""}<div class="art-m"><span class="art-src">${esc(it.source)}</span><span class="sep">·</span>${esc(it.date)}${readLink(it)}</div></button>${it.forma?forma(it.comp):""}</div>`).join("")}
      </section>`).join("")}
    </div>
    <div class="disc">L'Œil du Centaure — hebdomadaire d'actualité numérique composée à partir de sources publiques officielles : les 42 tribunaux administratifs et 9 cours administratives d'appel (métropole et outre-mer), le Conseil d'État, la CNDA, la Cour de justice de l'UE, la CEDH, la Commission européenne, la Cour de cassation et Légifrance. ${state.live?"Mise à jour automatique.":"Édition de démonstration ; flux à brancher via la fonction de collecte fournie."} Ne constitue pas une consultation juridique.</div>
  </div>`+colo();
}
function idx(it){return state.feed.indexOf(it);}
function sheet(comp,i){
  const it=state.feed[i];const c=COMP[comp];
  const ov=document.createElement("div");ov.className="overlay";ov.onclick=()=>ov.remove();
  ov.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <button class="sheet-close" onclick="this.closest('.overlay').remove()">✕</button>
    <div class="sheet-kick">DEMANDER UN ÉCLAIRAGE</div>
    <div class="sheet-sub">${esc(c.rub)}</div>
    <div class="sheet-titre">« ${esc(it.titre)} »</div>
    <div class="sheet-avts">${avatars(c.ref)}</div><p class="sheet-txt">${esc(c.ref)} et son équipe peuvent revenir vers vous sur l'impact de cette actualité pour votre activité. Un échange court, sans engagement.</p>
    <a class="sheet-cta" href="mailto:${c.mail}?subject=${encodeURIComponent("Éclairage — "+it.titre)}">Écrire à ${esc(c.ref)} →</a>
    <a class="sheet-source" href="${(it.lien&&/^https?:/.test(it.lien))?it.lien:srcHome(it)}" target="_blank" rel="noreferrer">Accéder à la source officielle ↗</a>
    <div class="sheet-or">ou</div>
    <a class="sheet-forma" href="${FORMA_URL}/formations/${c.forma.slug}" target="_blank" rel="noreferrer">Se former sur ce sujet · ${esc(c.forma.t)} ↗</a>
  </div>`;
  document.body.appendChild(ov);
}

/* démarrage : on tente le flux réel, puis on rend */
loadFeed().then(renderCover);
</script>
